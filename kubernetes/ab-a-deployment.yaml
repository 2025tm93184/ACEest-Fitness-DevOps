apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab
      version: a
  template:
    metadata:
      labels:
        app: aceest-ab
        version: a
    spec:
      containers:
        - name: aceest-fitness
          image: 2025tm93184/aceest-fitness:v1.0
          ports:
            - containerPort: 5000
