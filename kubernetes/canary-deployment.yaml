apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
  template:
    metadata:
      labels:
        app: aceest-canary
    spec:
      containers:
        - name: aceest-fitness
          image: 2025tm93184/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
